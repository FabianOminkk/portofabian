<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="16" fill="#07090e" stroke="url(#fav-grad)" stroke-width="3" />
  
  <!-- 3D Isometric Cube Matching 3D Portfolio Theme -->
  <g filter="url(#glow)">
    <!-- Top Face -->
    <path d="M32 12 L50 22 L32 32 L14 22 Z" fill="url(#fav-grad)" opacity="0.95" />
    <!-- Left Face -->
    <path d="M14 22 L32 32 L32 52 L14 42 Z" fill="#6366f1" opacity="0.8" />
    <!-- Right Face -->
    <path d="M32 32 L50 22 L50 42 L32 52 Z" fill="#a855f7" opacity="0.9" />
    <!-- Inner Wireframe Accent Lines -->
    <path d="M32 12 L32 32 M14 22 L32 32 M50 22 L32 32" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>